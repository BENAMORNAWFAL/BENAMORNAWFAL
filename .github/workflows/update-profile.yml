name: Update GitHub profile

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile/projects.json"
      - "scripts/generate-profile.mjs"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate profile statistics and featured projects
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/generate-profile.mjs

      - name: Commit generated profile
        run: |
          if git diff --quiet; then
            echo "Profile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-overview.svg
          git commit -m "chore(profile): refresh GitHub statistics and projects"
          git push
